<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quizphoria | Interactive Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="logo"><span class="mascot">🎯</span> Quizphoria!</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="features.html">Features</a></li>
      <li><a href="demo.html" class="active">Interactive Demo</a></li>
      <li><a href="docs.html">Documentation</a></li>
      <li><a href="https://github.com/atienosharzy-boop/quizphoria" target="_blank" class="btn-nav">GitHub Repo</a></li>
      <li><button class="theme-toggle-btn theme-toggle" title="Toggle theme">🌓</button></li>
    </ul>
  </nav>

  <div class="page-container">
    <div class="page-header">
      <h1>🎮 Interactive Quiz Demo</h1>
      <p>Test your knowledge live in the browser!</p>
    </div>
    <div class="quiz-wrapper">
      <div class="progress-bar" aria-hidden="true">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
      <canvas id="confetti-canvas"></canvas>
      <div style="display:flex; gap:1rem; align-items:center; margin-bottom:1rem; flex-wrap:wrap;">
        <label for="category-select" style="font-weight:600;">Choose Subject:</label>
        <select id="category-select">
          <option>All</option>
        </select>
        <label for="player-name" style="font-weight:600; margin-left:0.5rem;">Your Name:</label>
        <input id="player-name" placeholder="Enter your name (optional)" style="padding:0.6rem 1rem; border-radius:12px; border:1px solid #e6e6e6;" />
      </div>
      <div id="quiz-active">
        <div class="quiz-top">
          <span id="q-num" class="pill">Question 1 of 3</span>
          <span id="score-num" class="pill" style="color: var(--primary-pink);">Score: 0 ⭐</span>
        </div>
        <div style="text-align:center; margin-bottom:1rem;">
          <div style="display:inline-block; width:120px; height:120px; border-radius:50%; background:linear-gradient(135deg,var(--primary-blue),var(--primary-green)); box-shadow: 0 10px 30px rgba(2,6,23,0.12); animation: floaty 4s ease-in-out infinite;"></div>
        </div>
        <h2 id="q-text" class="question-text">Loading question...</h2>
        <div id="options-grid" class="options-list"></div>
        <button id="next-btn" class="btn btn-pink" style="display: none; margin-top: 2rem; width: 100%;">Next Question ➔</button>
      </div>

      <div id="quiz-end" style="display: none; text-align: center;">
        <div style="font-size: 4rem;">🏆</div>
        <h2 style="font-family: 'Fredoka'; margin: 1rem 0;">Fantastic Effort!</h2>
        <p id="final-score" style="font-size: 1.4rem; color: var(--text-muted); margin-bottom: 2rem;"></p>
        <div style="margin-bottom:1rem;">
          <button id="share-score" class="btn btn-purple" style="margin-right:0.8rem;">Share Result</button>
          <button id="save-image" class="btn" style="margin-right:0.8rem;">Save Result Image</button>
          <button onclick="resetQuiz()" class="btn btn-yellow">Play Again 🔄</button>
        </div>
        <div id="leaderboard" style="margin-top:1.2rem; text-align:left; max-width:480px; margin-left:auto; margin-right:auto;"></div>
        <div id="badge-display" style="margin-top:1rem; text-align:center;"></div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <p>&copy; 2026 Quizphoria. Created by <strong>Sharleen Atieno</strong></p>
  </footer>

  <script src="script.js"></script>
  <script src="ui.js"></script>
  <script>
    // Save image button
    document.getElementById('save-image').addEventListener('click', () => {
      const name = (document.getElementById('player-name')||{}).value || 'Player';
      const scoreText = document.getElementById('final-score') ? document.getElementById('final-score').textContent : '';
      generateResultImage(name, scoreText);
    });
  </script>
</body>
</html>
